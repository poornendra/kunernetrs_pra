apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: nginx-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: myapp.local  # Hostname for accessing the service
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-service  # Matches the Service name
                port:
                  number: 80  # Matches the Service port
